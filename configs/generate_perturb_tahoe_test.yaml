# Perturbation generation config — Tahoe100m testA
eval_cell_num: 3000
output_dir: /data/lep/CellTempo_noempty/CellTempo/output
comment: perturb_tahoe
save_name: perturb_tahoe_testB_subset_dose_step3900_maskprefix_vqfinetuned

# checkpoint to load (update to your best ckpt)
ckpt_path: /data/lep/CellTempo_noempty/ckpt/model_ckpt/from_pretrain_Tahoe100m_dose_50ep_neweval_maskprefix_vqfinetuned/checkpoint-3900

# DDP settings
backend: 'nccl'

batch_size: 32
block_size: 286
num_workers: 0
eval_batch_size: 32

# dataset
data_types: [perturb]
data_folders: [/data/lep/CellTempo_noempty/CellTempo/data]
dataset_names: [Tahoe100m]
meta_info_name: mix_meta_info_vq_traj.json
mapping_dict: /path/to/mapping_dict
global_dataset: Tahoe100m
vq_vae_path: /data/lep/CellTempo_noempty/ckpt/model_ckpt/vqvae_finetune_tahoe/checkpoint-200000/vqmodel

# drug molecular representation (UniMol 310M, dim=1024)
drug_emb_paths:
  - /data/lep/CellTempo_noempty/CellTempo/data/Tahoe100m/unimol310m_emb.pt
  - /data/lep/CellTempo_noempty/CellTempo/data/Tahoe100m/unimol310m_emb_testA.pt
  - /data/lep/CellTempo_noempty/CellTempo/data/Tahoe100m/unimol310m_emb_testB.pt
drug_emb_dim: 1024

max_new_tokens: 26

# number of cells to generate per pair (轮转 ctrl_id)
repeat_per_pair: 50

train_mode: 'pretrain'

# model
n_embd: 1120
n_head: 20
n_layer: 24
dropout: 0.0
bias: False
cell_pos_num: 21
use_flash: False

# system
device: 'cuda'
dtype: 'bfloat16'

# wandb logging
wandb_log: False
wandb_project: 'celltempo'
