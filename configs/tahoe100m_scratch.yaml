# default: config values
log_interval: 10 # log every n iterations; default 20 
eval_itervals: 30000 # eval interval in iterations; default 100
eval_iters: 1 # number of batches per eval
eval_cell_num: 30000 # number of cells per eval
eval_repeat_per_pair: 100 # generate N cells per pair during eval (testA_subset/testB_subset)
eval_before_train: false
# n_eval_cell: 100 # number of cells per eval batch
save_ckpt_iter: 1000 # save a checkpoint every n iterations
output_dir: "/data/lep/CellTempo_noempty/ckpt/model_ckpt"
comment: "from_scratch_Tahoe100m_dose_50ep_neweval_maskprefix_vqfinetuned"

always_save_checkpoint: True
init_from: 'scratch' #'resume' #
skip_optimizer_reload: true
# ckpt_path: /data/lep/CellTempo_noempty/ckpt/model_ckpt/celltempo_backbone_train_on_scbasetraj/checkpoint-10000
ckpt_path: null

# DDP settings
backend: 'nccl' # 'nccl', 'gloo', etc.
gradient_accumulation_steps: 5  # 5 * 4  # used to simulate larger batch sizes; must fits the number of devices
compile: False # Default True, use PyTorch 2.0 to compile the model to be faster

batch_size: 64
eval_batch_size: 128
block_size: 286
num_workers: 0

# training dataset
single_dataset_name: null
data_types: [perturb]
data_folders: [/data/lep/CellTempo_noempty/CellTempo/data] #/hpc-cache-pfs/home/bianhaiyang/veloMulan/dataHub/veloBD_rowcount, /hpc-cache-pfs/home/bianhaiyang/veloMulan/dataHub/veloBD_lognorm_ver2, /hpc-cache-pfs/home/bianhaiyang/veloMulan/dataHub/scPert_expanded
dataset_names: [Tahoe100m] # velo3000 velo_dataset, perturb_train_val_leave_one_only
meta_info_name: mix_meta_info_vq_traj.json # mix_meta_info_expanded
mapping_dict: /path/to/mapping_dict
global_dataset: Tahoe100m
vq_vae_path: /data/lep/CellTempo_noempty/ckpt/model_ckpt/vqvae_finetune_tahoe/checkpoint-200000/vqmodel

# drug molecular representation (UniMol 310M, dim=1024)
drug_emb_paths:
  - /data/lep/CellTempo_noempty/CellTempo/data/Tahoe100m/unimol310m_emb.pt
  - /data/lep/CellTempo_noempty/CellTempo/data/Tahoe100m/unimol310m_emb_testA.pt
  - /data/lep/CellTempo_noempty/CellTempo/data/Tahoe100m/unimol310m_emb_testB.pt
drug_emb_dim: 1024

max_new_tokens: 512
max_new_tokens_eval: 26

train_mode: 'pretrain'

# model
n_embd: 1120 #240 #600 #1120
n_head: 20 #6 #12 #20
n_layer: 24 #6 #12 #24
dropout: 0.1 # for pretraining 0 is good, for finetuning try 0.1+
bias: False
cell_pos_num: 21


# adamw optimizer
learning_rate: 1.0e-4 #1.0e-4 #  6.0e-4; max learning rate, 6.0 not 6 
max_iters: 50000 # total number of training iterations'
max_epochs: 50
weight_decay: 1.0e-1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0 # clip gradients at this value, or disable if == 0.0


# learning rate decay settings
decay_lr: True # whether to decay the learning rate
warmup_ratio: 0.05 # fraction of total steps used for warmup
lr_decay_iters: 50000 # should be ~= max_iters per Chinchilla
min_lr: 1.0e-5 # minimum learning rate, should be ~= learning_rate/10 per Chinchilla

# system
device: 'cuda' # examples: 'cpu', 'cuda', 'cuda:0', 'cuda:1' etc., or try 'mps' on macbooks
dtype: 'bfloat16' # 'float32', 'bfloat16', or 'float16', the latter will auto implement a GradScaler

# wandb logging
wandb_log: True # disabled by default
wandb_project: 'celltempo'